# Local Mosquitto config for the cloud-free Ambientika stack.
listener 1883
allow_anonymous true

# Optional WebSocket listener (used if the PWA talks MQTT-over-WS directly).
listener 9001
protocol websockets

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# NOTE: allow_anonymous is fine on an isolated home LAN. For a hardened setup,
# set allow_anonymous false and add a password_file with a dedicated user, then
# set MQTT_USER / MQTT_PASSWORD on the local-bridge and backend services.
