<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0066cc"/>
<title>Ambientika Local</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-192.png"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#0066cc;--primary-d:#004fa3;--bg:#f0f4f8;--card:#ffffff;--nav-bg:#ffffff;--header-bg:#ffffff;--text:#1a202c;--muted:#718096;--border:#e2e8f0;--green:#38a169;--red:#e53e3e;--orange:#dd6b20;--purple:#805ad5;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08);}
[data-theme="dark"]{--bg:#0f1117;--card:#1a1f2e;--nav-bg:#1a1f2e;--header-bg:#13161f;--text:#e2e8f0;--muted:#a0aec0;--border:#2d3748;--shadow:0 2px 12px rgba(0,0,0,.4);}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
header{background:var(--header-bg);border-bottom:1px solid var(--border);padding:.6rem 1.2rem;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.logo-svg{display:block;height:38px;width:auto}
.header-divider{width:1px;height:30px;background:var(--border);margin:0 14px}
.app-label{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.badge{font-size:.72rem;background:#f0fff4;color:#276749;border:1px solid #c6f6d5;padding:.28rem .85rem;border-radius:999px;display:flex;align-items:center;gap:.4rem;font-weight:700}
[data-theme="dark"] .badge{background:#1a2e22;color:#68d391;border-color:#276749}
#mqtt-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fc8181}
#mqtt-dot.connected{background:#68d391}
.dark-toggle,.settings-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:.3rem .55rem;cursor:pointer;font-size:.85rem;color:var(--muted)}
.dark-toggle{font-size:1rem}
.settings-btn:hover,.dark-toggle:hover{border-color:var(--primary);color:var(--primary)}
.lang-select{background:var(--card);border:1.5px solid var(--border);border-radius:8px;padding:.3rem .45rem;font-size:.75rem;color:var(--muted);cursor:pointer;outline:none}
.lang-select:hover,.lang-select:focus{border-color:var(--primary);color:var(--primary)}
.all-bar{background:var(--card);border-bottom:1px solid var(--border);padding:.5rem 1.2rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.all-bar-label{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:.3rem;white-space:nowrap}
.all-btn{padding:.3rem .7rem;border:1.5px solid var(--border);border-radius:7px;background:var(--card);font-size:.67rem;font-weight:700;cursor:pointer;color:var(--muted)}
.all-btn:hover{border-color:var(--primary);color:var(--primary)}
[data-theme="dark"] .all-btn:hover{border-color:var(--primary);color:var(--primary);background:rgba(0,102,204,.15)}
nav{background:var(--nav-bg);border-bottom:2px solid var(--border);padding:0 1.2rem;display:flex}
.nav-tab{padding:.7rem 1.1rem;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.nav-tab.active{color:var(--primary);border-bottom-color:var(--primary)}
main{max-width:1100px;margin:0 auto;padding:1.25rem}
.section-title{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.9rem;font-weight:700}
.zone-group{margin-bottom:1.6rem}
.zone-group-header{display:flex;align-items:center;gap:.55rem;margin-bottom:.75rem;padding-bottom:.45rem;border-bottom:2px solid var(--border)}
.zone-group-title{font-size:.78rem;font-weight:800;color:var(--text)}
.zone-group-badge{font-size:.58rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.zone-master-badge{background:#fefcbf;color:#744210;border-color:#f6e05e}
[data-theme="dark"] .zone-master-badge{background:#2d2a14;color:#f6e05e;border-color:#744210}
.zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.25rem}
.device-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2rem;border:1px solid var(--border);cursor:pointer;transition:box-shadow .15s,border-color .15s}
.device-card:hover{box-shadow:0 4px 20px rgba(0,102,204,.13);border-color:rgba(0,102,204,.3)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.85rem;gap:.5rem}
.card-title h2{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.card-meta{display:flex;align-items:center;gap:.35rem;margin-top:.22rem;flex-wrap:wrap}
.device-type-badge{font-size:.58rem;font-weight:700;padding:.13rem .42rem;border-radius:6px;background:#ebf8ff;color:#2b6cb0;border:1px solid #bee3f8}
.role-badge{font-size:.58rem;font-weight:700;padding:.13rem .42rem;border-radius:6px}
.role-master{background:#fefcbf;color:#744210;border:1px solid #f6e05e}
.role-slave{background:#e9d8fd;color:#553c9a;border:1px solid #d6bcfa}
[data-theme="dark"] .device-type-badge{background:#1a2e3d;color:#63b3ed;border-color:#2b6cb0}
[data-theme="dark"] .role-master{background:#2d2a14;color:#f6e05e;border-color:#744210}
[data-theme="dark"] .role-slave{background:#2d1f4e;color:#b794f4;border-color:#553c9a}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:4px}
.status-dot.online{background:var(--green)}
.metrics{display:flex;gap:.55rem;margin-bottom:1rem}
.metric{background:#f7fafc;border-radius:8px;padding:.48rem .55rem;text-align:center;flex:1;border:1px solid var(--border)}
[data-theme="dark"] .metric{background:#0f1117}
.metric .val{font-size:.95rem;font-weight:800;color:var(--primary)}
.metric .lbl{font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.modes-label{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem;display:flex;align-items:center;justify-content:space-between}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:.28rem;margin-bottom:.9rem}
.mode-btn-wrap{position:relative;display:flex;flex-direction:column}
.mode-btn{padding:.35rem .1rem;border:1.5px solid var(--border);border-radius:7px;background:var(--card);font-size:.59rem;font-weight:700;cursor:pointer;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.mode-btn:hover{border-color:var(--primary);color:var(--primary)}
.mode-btn.active{border-color:var(--primary);background:var(--primary);color:#fff}
.mode-btn.smart-active{border-color:var(--purple);background:var(--purple);color:#fff}
.mode-info-btn{position:absolute;top:2px;right:3px;background:none;border:none;cursor:pointer;font-size:.58rem;color:rgba(0,0,0,.3);padding:0;line-height:1;z-index:2}
.mode-btn.active .mode-info-btn,.mode-btn.smart-active .mode-info-btn{color:rgba(255,255,255,.7)}
.mode-info-btn:hover{color:var(--primary)!important}
.mode-popup{display:none;position:fixed;z-index:500;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 6px 28px rgba(0,0,0,.22);padding:.85rem 1rem;max-width:270px;width:260px}
.mode-popup.open{display:block}
.mode-popup h4{font-size:.78rem;font-weight:800;margin-bottom:.45rem;display:flex;align-items:center;gap:.4rem}
.mode-popup p{font-size:.7rem;color:var(--muted);line-height:1.55;margin-bottom:.35rem}
.mode-popup ul{font-size:.68rem;color:var(--muted);padding-left:1.1rem;line-height:1.6;margin-bottom:.35rem}
.mode-popup-close{position:absolute;top:.45rem;right:.6rem;background:none;border:none;cursor:pointer;font-size:.85rem;color:var(--muted)}
.fan-row{display:flex;align-items:center;gap:.6rem}
.fan-row label{font-size:.7rem;color:var(--muted);white-space:nowrap;font-weight:600}
.fan-row input[type=range]{flex:1;accent-color:var(--primary)}
.fan-val{font-size:.78rem;font-weight:800;width:34px;text-align:right;color:var(--primary)}
.filter-alarm{display:flex;align-items:center;gap:.45rem;margin-top:.85rem;padding:.48rem .7rem;background:#fff5f5;border-radius:8px;border:1px solid #fed7d7;font-size:.69rem;color:var(--red);font-weight:700}
[data-theme="dark"] .filter-alarm{background:#2d1515;border-color:#822727}
.smart-badge{font-size:.58rem;font-weight:700;padding:.13rem .42rem;border-radius:999px;background:#f5f0ff;color:var(--purple);border:1px solid #d6bcfa}
.detail-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;align-items:flex-start;justify-content:center;overflow-y:auto;padding:1.5rem .75rem}
.detail-modal.open{display:flex}
.detail-box{background:var(--card);border-radius:var(--radius);padding:1.5rem;width:100%;max-width:520px;box-shadow:0 8px 40px rgba(0,0,0,.3);margin:auto;position:relative}
.detail-box h2{font-size:1.05rem;font-weight:800;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.detail-close{position:absolute;top:.9rem;right:1rem;background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted)}
.detail-section{margin-bottom:1.1rem}
.detail-section h3{font-size:.62rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:.38rem}
.detail-row{display:flex;align-items:center;justify-content:space-between;padding:.3rem .5rem;background:var(--bg);border-radius:6px;font-size:.74rem}
.detail-row .dl{color:var(--muted);font-size:.68rem}
.detail-row .dv{font-weight:800;color:var(--text)}
.detail-row .dv.ok{color:var(--green)}.detail-row .dv.warn{color:var(--orange)}.detail-row .dv.bad{color:var(--red)}
.detail-mode-current{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;border-radius:9px;background:var(--bg);border:1px solid var(--border);margin-bottom:.65rem}
.dmc-icon{font-size:1.2rem}
.dmc-info .dmc-label{font-size:.62rem;color:var(--muted);font-weight:600}
.dmc-info .dmc-val{font-size:.88rem;font-weight:800}
#empty-state{text-align:center;padding:4rem 1rem;color:var(--muted)}
.schedule-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:1.1rem;overflow:hidden}
.sc-header{background:var(--bg);padding:.75rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.sc-header h2{font-size:.88rem;font-weight:700}
.sc-header-btns{display:flex;gap:.35rem}
.add-slot-btn-top,.copy-day-btn{font-size:.66rem;font-weight:700;border:1.5px solid var(--border);padding:.23rem .6rem;border-radius:6px;background:var(--card);cursor:pointer;color:var(--muted)}
.add-slot-btn-top{color:var(--primary);border-color:var(--primary)}
.copy-day-btn:hover{border-color:var(--orange);color:var(--orange)}
.weekdays{display:flex;border-bottom:1px solid var(--border)}
.wd{flex:1;text-align:center;padding:.48rem .2rem;font-size:.66rem;font-weight:700;color:var(--muted);cursor:pointer;border-right:1px solid var(--border)}
.wd:last-child{border-right:none}
.wd.active{background:var(--primary);color:#fff}
.sc-body{padding:.85rem 1.1rem}
.time-slot{display:flex;align-items:center;gap:.45rem;padding:.48rem .7rem;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-bottom:.45rem}
.ts-time{font-size:.75rem;font-weight:800;min-width:105px}
.ts-overnight{font-size:.56rem;font-weight:700;padding:.1rem .32rem;border-radius:4px;background:#e9d8fd;color:#553c9a;border:1px solid #d6bcfa;white-space:nowrap;flex-shrink:0}
[data-theme="dark"] .ts-overnight{background:#2d1f4e;color:#b794f4;border-color:#553c9a}
.ts-mode{font-size:.62rem;font-weight:700;padding:.15rem .45rem;border-radius:6px;white-space:nowrap}.m-HRV,.m-MANUAL_HRV{background:#ebf8ff;color:#2b6cb0}.m-NIGHT{background:#e9d8fd;color:#3c366b}.m-BOOST,.m-TIMED_EXHAUST{background:#fff5f0;color:#c05621}.m-AWAY{background:#f0fff4;color:#276749}.m-SMART{background:#f5f0ff;color:#553c9a}.m-AUTO{background:#fffbeb;color:#744210}.m-MONITORING{background:#fef3c7;color:#92400e}.m-EXHAUST{background:#fce7f3;color:#9d174d}.m-SUPPLY{background:#ecfdf5;color:#065f46}.m-MS_FLOW,.m-SM_FLOW{background:#e0f2fe;color:#075985}.m-OFF{background:#f7fafc;color:var(--muted)}
[data-theme="dark"] .m-HRV,[data-theme="dark"] .m-MANUAL_HRV{background:#1a2e3d;color:#63b3ed}[data-theme="dark"] .m-NIGHT{background:#2d1f4e;color:#b794f4}[data-theme="dark"] .m-SMART{background:#2d1f4e;color:#d6bcfa}[data-theme="dark"] .m-AUTO{background:#2d2a14;color:#f6e05e}[data-theme="dark"] .m-MONITORING{background:#2d2710;color:#f6d860}[data-theme="dark"] .m-BOOST,[data-theme="dark"] .m-TIMED_EXHAUST{background:#2d1e14;color:#f6ad55}[data-theme="dark"] .m-AWAY{background:#1a2e22;color:#68d391}[data-theme="dark"] .m-EXHAUST{background:#2d1525;color:#f687b3}[data-theme="dark"] .m-SUPPLY{background:#14291f;color:#6ee7b7}[data-theme="dark"] .m-MS_FLOW,[data-theme="dark"] .m-SM_FLOW{background:#0c2233;color:#7dd3fc}[data-theme="dark"] .m-OFF{background:#1a1f2e;color:var(--muted)}
.ts-fan{margin-left:auto;font-size:.65rem;color:var(--muted);font-weight:600;white-space:nowrap}
.ts-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:.85rem;padding:0 .12rem;flex-shrink:0}
.ts-del:hover{color:var(--red)}
.add-slot-btn{width:100%;padding:.52rem;border:2px dashed var(--border);border-radius:8px;background:transparent;color:var(--muted);font-size:.7rem;font-weight:700;cursor:pointer;margin-top:.4rem}
.add-slot-btn:hover{border-color:var(--primary);color:var(--primary)}
.copy-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.copy-modal.open{display:flex}
.copy-modal-box{background:var(--card);border-radius:var(--radius);padding:1.4rem;min-width:260px;max-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.copy-modal-box h3{font-size:.9rem;font-weight:800;margin-bottom:.9rem}
.copy-days-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-bottom:.9rem}
.copy-day-check{display:flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer}
.copy-day-check input{accent-color:var(--primary)}
.copy-modal-btns{display:flex;gap:.45rem;justify-content:flex-end}
.slot-form{background:var(--bg);border-radius:8px;border:1px solid var(--border);padding:.85rem;margin-top:.55rem;display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.slot-form label{font-size:.65rem;font-weight:700;color:var(--muted);display:block;margin-bottom:.15rem}
.slot-form input,.slot-form select{width:100%;padding:.35rem .5rem;border:1.5px solid var(--border);border-radius:6px;font-size:.75rem;background:var(--card);color:var(--text)}
.slot-form-hint{grid-column:span 2;font-size:.62rem;color:var(--purple);background:#f5f0ff;border:1px solid #d6bcfa;border-radius:6px;padding:.4rem .6rem;line-height:1.5;display:none}
[data-theme="dark"] .slot-form-hint{background:#2d1f4e;border-color:#553c9a;color:#b794f4}
.slot-form-hint.visible{display:block}
.slot-form-actions{grid-column:span 2;display:flex;gap:.38rem;justify-content:flex-end;margin-top:.18rem}
.btn-save{background:var(--primary);color:#fff;border:none;border-radius:6px;padding:.35rem .85rem;font-size:.72rem;font-weight:700;cursor:pointer}
.btn-cancel{background:var(--card);color:var(--muted);border:1.5px solid var(--border);border-radius:6px;padding:.35rem .7rem;font-size:.72rem;font-weight:700;cursor:pointer}
.smart-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem;margin-bottom:1.1rem}
@media(max-width:580px){.smart-grid{grid-template-columns:1fr}}
.smart-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:1.05rem}
.smart-card h3{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.8rem}
.cond-row{display:flex;align-items:center;justify-content:space-between;padding:.35rem 0;border-bottom:1px solid var(--border);font-size:.75rem}
.cond-row:last-child{border-bottom:none}
.cond-label{color:var(--muted);font-size:.7rem}
.cond-val{font-weight:800}.cond-val.ok{color:var(--green)}.cond-val.warn{color:var(--orange)}
.mode-ind{display:flex;align-items:center;gap:.55rem;padding:.55rem .75rem;border-radius:9px;margin-bottom:.5rem;border:1px solid var(--border);background:var(--bg)}
.mode-ind.active{background:#f0fff4;border-color:#c6f6d5}.mode-ind.summer{background:#fffaf0;border-color:#fbd38d}
[data-theme="dark"] .mode-ind.active{background:#1a2e22;border-color:#276749}[data-theme="dark"] .mode-ind.summer{background:#2d2014;border-color:#744210}
.mi-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;background:var(--border)}
.mi-info{flex:1}.mi-name{font-size:.75rem;font-weight:800}.mi-desc{font-size:.62rem;color:var(--muted);margin-top:1px}
.mi-badge{font-size:.6rem;font-weight:700;padding:.13rem .42rem;border-radius:999px;background:var(--border);color:var(--muted);white-space:nowrap}
.mi-badge.on{background:#c6f6d5;color:#276749}.mi-badge.sun{background:#fbd38d;color:#744210}
[data-theme="dark"] .mi-badge.on{background:#1a2e22;color:#68d391}
.smart-dev-select{display:flex;gap:.45rem;margin-bottom:1rem;flex-wrap:wrap}
.dev-chip{padding:.3rem .75rem;border-radius:999px;border:1.5px solid var(--border);background:var(--card);font-size:.7rem;font-weight:700;cursor:pointer;color:var(--muted)}
.dev-chip.active{border-color:var(--purple);background:var(--purple);color:#fff}
.chart-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:1.05rem;margin-bottom:1.1rem}
.chart-wrap h3{font-size:.65rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.65rem}
canvas{width:100%!important;height:155px!important}
.weather-bar{background:var(--card);border-bottom:1px solid var(--border);padding:.45rem 1.2rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;font-size:.72rem}
.weather-loc{font-weight:700;color:var(--text);display:flex;align-items:center;gap:.3rem}
.weather-item{display:flex;align-items:center;gap:.28rem;color:var(--muted)}
.weather-item strong{color:var(--text);font-weight:800}
.weather-aqi{padding:.18rem .5rem;border-radius:6px;font-size:.65rem;font-weight:700}
.aqi-1{background:#c6f6d5;color:#276749}.aqi-2{background:#fefcbf;color:#744210}.aqi-3{background:#fed7aa;color:#c05621}.aqi-4{background:#fed7d7;color:#9b2c2c}.aqi-5{background:#e9d8fd;color:#553c9a}
[data-theme="dark"] .aqi-1{background:#1a2e22;color:#68d391}[data-theme="dark"] .aqi-2{background:#2d2a14;color:#f6e05e}[data-theme="dark"] .aqi-3{background:#2d1e14;color:#f6ad55}[data-theme="dark"] .aqi-4{background:#2d1515;color:#fc8181}[data-theme="dark"] .aqi-5{background:#2d1f4e;color:#b794f4}
.weather-refresh{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.75rem;margin-left:.2rem;padding:.1rem .3rem}
.weather-refresh:hover{color:var(--primary)}
.weather-no-key{font-size:.7rem;color:var(--muted);display:flex;align-items:center;gap:.4rem}
.settings-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.settings-modal.open{display:flex}
.settings-box{background:var(--card);border-radius:var(--radius);padding:1.5rem;min-width:300px;max-width:420px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.settings-box h3{font-size:1rem;font-weight:800;margin-bottom:1.1rem;display:flex;align-items:center;gap:.4rem}
.settings-section{margin-bottom:1.1rem}
.settings-section h4{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.55rem;padding-bottom:.3rem;border-bottom:1px solid var(--border)}
.settings-row{margin-bottom:.65rem}
.settings-row label{font-size:.7rem;font-weight:700;color:var(--muted);display:block;margin-bottom:.25rem}
.settings-row input{width:100%;padding:.42rem .6rem;border:1.5px solid var(--border);border-radius:7px;font-size:.8rem;background:var(--bg);color:var(--text);outline:none}
.settings-row input:focus{border-color:var(--primary)}
.settings-row small{font-size:.62rem;color:var(--muted);margin-top:.2rem;display:block}
.settings-hint{font-size:.66rem;color:var(--muted);background:var(--bg);border-radius:7px;padding:.5rem .7rem;margin-top:.4rem;line-height:1.5}
.settings-btns{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem}
.outdoor-compare{background:var(--bg);border-radius:9px;border:1px solid var(--border);padding:.65rem .85rem;margin-bottom:.85rem;display:grid;grid-template-columns:1fr auto 1fr;gap:.5rem;align-items:center}
.oc-side{font-size:.72rem}.oc-side h4{font-size:.6rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem}
.oc-val{font-size:.85rem;font-weight:800;color:var(--text);margin-bottom:.12rem}.oc-sub{font-size:.62rem;color:var(--muted)}
.oc-arrow{text-align:center;font-size:1rem;color:var(--muted)}
.oc-badge{font-size:.58rem;font-weight:700;padding:.1rem .35rem;border-radius:5px;display:inline-block;margin-top:.1rem}
.oc-in{background:#ebf8ff;color:#2b6cb0}.oc-out{background:#f0fff4;color:#276749}.oc-warn{background:#fff5f0;color:#c05621}
[data-theme="dark"] .oc-in{background:#1a2e3d;color:#63b3ed}[data-theme="dark"] .oc-out{background:#1a2e22;color:#68d391}[data-theme="dark"] .oc-warn{background:#2d1e14;color:#f6ad55}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(2rem);background:#2d3748;color:#fff;padding:.55rem 1.2rem;border-radius:999px;font-size:.75rem;opacity:0;transition:all .3s;pointer-events:none;z-index:999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:2rem;font-size:.65rem;color:var(--muted)}
footer strong{color:var(--text)}
@media(max-width:520px){header{padding:.5rem .75rem}.logo-svg{height:32px}main{padding:.85rem}.modes{grid-template-columns:repeat(3,1fr)}}

.nc-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.nc-logo{flex-shrink:0}
.nc-logo svg{display:block;height:56px;width:auto;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.nc-hero-txt{flex:1;min-width:0}
.nc-hero-txt h1{font-size:1.12rem;font-weight:900;letter-spacing:.01em;display:flex;align-items:baseline;gap:.15rem}
.nc-reg{font-size:.7rem;font-weight:700;opacity:.85}
.nc-hero-txt p{font-size:.74rem;opacity:.92;margin-top:.2rem;font-weight:600}
.nc-status-pill{flex-shrink:0;font-size:.68rem;font-weight:800;padding:.4rem .8rem;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);white-space:nowrap}
.nc-status-pill.warn{background:#dd6b20;border-color:#f6ad55}
.nc-status-pill.prot{background:#e53e3e;border-color:#fc8181}
.nc-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.15rem;margin-bottom:1rem}
@media(max-width:640px){.nc-grid{grid-template-columns:1fr}}
.nc-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:1.15rem;position:relative}
.nc-card.on{border-color:#f6ad55;box-shadow:0 0 0 2px rgba(221,107,32,.18),var(--shadow)}
.nc-card.on.danger{border-color:#fc8181;box-shadow:0 0 0 2px rgba(229,62,62,.2),var(--shadow)}
.nc-card-head{display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem}
.nc-card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;background:var(--bg);border:1px solid var(--border);flex-shrink:0}
.nc-card-title{font-size:.9rem;font-weight:800}
.nc-card-sub{font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.nc-badge{margin-left:auto;font-size:.62rem;font-weight:800;padding:.24rem .6rem;border-radius:999px;background:#f0fff4;color:#276749;border:1px solid #c6f6d5;white-space:nowrap}
.nc-badge.on{background:#fffaf0;color:#c05621;border-color:#fbd38d}
.nc-badge.danger{background:#fff5f5;color:#c53030;border-color:#feb2b2}
[data-theme="dark"] .nc-badge{background:#14291f;color:#68d391;border-color:#276749}
[data-theme="dark"] .nc-badge.on{background:#2d2014;color:#f6ad55;border-color:#744210}
[data-theme="dark"] .nc-badge.danger{background:#2d1515;color:#fc8181;border-color:#822727}
.nc-readout{display:flex;gap:.5rem;margin:.55rem 0 .35rem}
.nc-metric{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:.5rem .55rem;text-align:center}
.nc-metric .v{font-size:1.02rem;font-weight:900;color:var(--text)}
.nc-metric .l{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;font-weight:700}
.nc-bar{height:7px;border-radius:99px;background:var(--border);overflow:hidden;margin:.55rem 0 .2rem}
.nc-bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#38a169,#dd6b20 70%,#e53e3e);transition:width .4s}
.nc-desc{font-size:.68rem;color:var(--muted);line-height:1.5;margin:.5rem 0 .85rem}
.nc-btns{display:flex;gap:.5rem}
.nc-btn{flex:1;padding:.5rem .4rem;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:.68rem;font-weight:800;cursor:pointer;color:var(--text)}
.nc-btn:hover{border-color:var(--primary);color:var(--primary)}

.nc-btn.danger{background:#e53e3e;border-color:#e53e3e;color:#fff}

function getWDL(){return {mon:T('mon'),tue:T('tue'),wed:T('wed'),thu:T('thu'),fri:T('fri'),sat:T('sat'),sun:T('sun')};}
function getWDN(){return {mon:T('Monday'),tue:T('Tuesday'),wed:T('Wednesday'),thu:T('Thursday'),fri:T('Friday'),sat:T('Saturday'),sun:T('Sunday')};}

/* Helper: check if a slot crosses midnight */
function isOvernight(slot){
  if(slot.isOvernight)return true;
  if(!slot.start||!slot.end)return false;
  return slot.end<=slot.start;
}

/* Render a single time slot row */
function renderSlotRow(x,i,did){
  const ov=isOvernight(x);
  const timeStr=ov?x.start+' ▸ '+x.end+' ('+T('overnight')+')':x.start+' – '+x.end;
  const ovBadge=ov?'<span class="ts-overnight" title="'+Tf('overnightHint',x.end)+'">'+T('overnight')+'</span>':'';
  return '<div class="time-slot'+(ov?' style="border-color:rgba(128,90,213,.35)"':'')+'">'+
    '<span class="ts-time">'+timeStr+'</span>'+ovBadge+
    '<span class="ts-mode m-'+x.mode+'">'+(ML(x.mode)||x.mode)+'</span>'+
    '<span class="ts-fan">'+(x.fanSpeed!=null?x.fanSpeed+'%':T('slotFanPh'))+'</span>'+
    '<button class="ts-del" onclick="delSlot(\''+did+'\','+i+')">&#10005;</button>'+
    '</div>';
}

function checkOvernight(did){
  const sv=document.getElementById('sf-s-'+did);
  const ev=document.getElementById('sf-e-'+did);
  const hint=document.getElementById('sf-hint-'+did);
  if(!sv||!ev||!hint)return;
  const ov=ev.value&&sv.value&&ev.value<=sv.value;
  hint.classList.toggle('visible',!!ov);
}

async function saveSlot(did){
  const sst=scSt[did];
  const sv=document.getElementById('sf-s-'+did).value;
  const en=document.getElementById('sf-e-'+did).value;
  const mo=document.getElementById('sf-m-'+did).value;
  const fv=document.getElementById('sf-f-'+did).value;
  if(!sv||!en){toast(T('enterTimes'));return;}
  const ov=en<=sv; /* overnight if end <= start */
  const w=schedules[did]||{};
  const day=sst.day;
  const newSlot={start:sv,end:en,mode:mo,fanSpeed:fv!==''?parseInt(fv):null};
  if(ov)newSlot.isOvernight=true;
  const sl=[...(w[day]||[]),newSlot];
  /* Sort: overnight slots go last (after all same-day slots) */
  sl.sort((a,b)=>{
    const aOv=isOvernight(a),bOv=isOvernight(b);
    if(aOv&&!bOv)return 1;
    if(!aOv&&bOv)return -1;
    return a.start.localeCompare(b.start);
  });
  try{
    await apiFetch('/devices/'+did+'/schedule/'+day,'PUT',sl);

async function fetchWeather(){const key=getOwmKey(),loc=getOwmLoc();if(!key||!loc){renderWeatherBar(null);return;}try{let lat,lon;if(/^-?[\d.]+\s*,\s*-?[\d.]+$/.test(loc)){[lat,lon]=loc.split(',').map(s=>parseFloat(s.trim()));}else{const geo=await fetch('https://api.openweathermap.org/geo/1.0/direct?q='+encodeURIComponent(loc)+'&limit=1&appid='+key);const gd=await geo.json();if(!gd.length)throw new Error('Location not found: '+loc);lat=gd[0].lat;lon=gd[0].lon;}const[wRes,aRes]=await Promise.all([fetch('https://api.openweathermap.org/data/2.5/weather?lat='+lat+'&lon='+lon+'&units=metric&lang=de&appid='+key),fetch('https://api.openweathermap.org/data/2.5/air_pollution?lat='+lat+'&lon='+lon+'&appid='+key)]);const w=await wRes.json();const a=await aRes.json();owmData={temp:w.main.temp,humidity:w.main.humidity,city:w.name,country:w.sys.country,aqi:a.list[0].main.aqi,updated:Date.now()};renderWeatherBar(owmData);if(activeSmartDevice&&document.getElementById('view-smart').style.display!=='none')loadSmart(activeSmartDevice);}catch(err){renderWeatherBar(null,err.message);}}
function renderWeatherBar(d,err){const bar=document.getElementById('weather-bar');if(!getOwmKey()||!getOwmLoc()){bar.innerHTML='<span class="weather-no-key">&#127780;&#65039; <a href="#" onclick="openSettings();return false;" style="color:var(--primary);font-weight:700">'+T('weatherSetup')+'</a> — '+T('weatherHint')+'</span>';return;}if(err){bar.innerHTML='<span class="weather-no-key">&#127780;&#65039; '+T('weatherError')+err+' <button class="weather-refresh" onclick="fetchWeather()">'+T('weatherRetry')+'</button></span>';return;}if(!d){bar.innerHTML='<span class="weather-no-key">&#127780;&#65039; '+T('weatherLoading')+'</span>';return;}const age=Math.round((Date.now()-d.updated)/60000);bar.innerHTML='<span class="weather-loc">&#127780;&#65039; '+d.city+', '+d.country+'</span><span class="weather-item">&#127777;&#65039; '+T('weatherOutdoor')+' <strong>'+d.temp.toFixed(1)+'°C</strong></span><span class="weather-item">&#128167; '+T('weatherHumidity')+' <strong>'+d.humidity+'%</strong></span><span class="weather-item"><span class="weather-aqi '+aqiClass(d.aqi)+'">'+aqiLabel(d.aqi)+'</span></span><span class="weather-item" style="color:var(--muted);font-size:.65rem">'+Tf('weatherAgo',age)+' <button class="weather-refresh" onclick="fetchWeather()">&#8635;</button></span>';}

async function loadSmart(did){const el=document.getElementById('smart-content');try{const s=await apiFetch('/devices/'+did+'/smart');const sensors=s.sensors||{};const tin=sensors.temperature_in;const hin=sensors.humidity_in;const tout=owmData?owmData.temp:sensors.temperature_out;const hout=owmData?owmData.humidity:sensors.humidity_out;let compareHtml='';if(tin!=null&&tout!=null){const diff=tin-tout;const arrow=diff>0?T('coolPossible'):diff<-1?T('heatSugg'):T('balanced');const tempOcBadge=Math.abs(diff)>2?'oc-warn':'oc-out';compareHtml='<div class="outdoor-compare"><div class="oc-side"><h4>&#127968; '+T('inside')+'</h4><div class="oc-val">'+tin.toFixed(1)+'°C</div>'+(hin!=null?'<div class="oc-sub">'+hin+'% rF</div>':'')+'<span class="oc-badge oc-in">'+T('devSensor')+'</span></div><div class="oc-arrow">&#8652;<br/><span style="font-size:.6rem;color:var(--muted)">'+arrow+'</span></div><div class="oc-side" style="text-align:right"><h4>&#127780;&#65039; '+T('outside')+'</h4><div class="oc-val">'+tout.toFixed(1)+'°C</div>'+(hout!=null?'<div class="oc-sub">'+hout+'% rF</div>':'')+'<span class="oc-badge '+tempOcBadge+'">'+(owmData?T('openWeather'):T('weatherStation'))+'</span></div></div>';}
el.innerHTML=compareHtml+'<div class="chart-wrap"><h3>&#128200; '+T('histTitle')+'</h3><canvas id="hist-chart"></canvas></div><div class="smart-grid"><div class="smart-card"><h3>&#128225; '+T('measures')+'</h3>'+row(T('innerTemp'),tin!=null?tin.toFixed(1)+' °C':'—')+row(T('outerTemp'),tout!=null?tout.toFixed(1)+' °C':'—')+row(T('humIn'),hin!=null?hin+' %':'—')+row(T('humOut'),hout!=null?hout+' %':'—')+row(T('airQuality'),sensors.airQuality_voc!=null?sensors.airQuality_voc+' ppm':'—',(sensors.airQuality_voc||0)>600?'warn':'ok')+row(T('light'),sensors.isDark?T('dark'):T('bright'),sensors.isDark?'warn':'ok')+(owmData?row(T('airQualityOut'),'<span class="weather-aqi '+aqiClass(owmData.aqi)+'">'+aqiLabel(owmData.aqi)+'</span>',''):'')+' </div><div class="smart-card"><h3>&#129504; '+T('automation')+'</h3>'+modeInd('🌬️',T('hrv_label'),s.activeMode==='HRV_MEDIUM'?T('hrv_active'):s.activeMode==='HRV_MIN'?T('hrv_min'):T('hrv_off'),s.activeMode==='HRV_MEDIUM'||s.activeMode==='HRV_MIN')+modeInd('🌙',T('nightMode'),T('nightActive'),s.conditions&&s.conditions.nightModeActive)+modeInd('☀️',T('freeCool'),T('freeCoolCond'),false,s.conditions&&s.conditions.freeCoolingActive)+'</div></div><div class="smart-card" style="margin-bottom:1.1rem"><h3>⚙️ '+T('smartLogic')+'</h3>'+((s.logic||[]).map(l=>'<div class="cond-row"><span class="cond-label">'+l.condition+'</span><span class="cond-val">→ '+l.result+'</span></div>').join(''))+'</div>';drawChart(did);}catch(e){el.innerHTML='<p style="color:var(--red);padding:1rem">Error: '+e.message+'</p>';}}
function drawChart(did){const hist=history_data[did]||[];const canvas=document.getElementById('hist-chart');if(!canvas)return;const W=canvas.offsetWidth||800,H=155;canvas.width=W;canvas.height=H;const isDark=document.documentElement.getAttribute('data-theme')==='dark';const bg=isDark?'#1a1f2e':'#fff',gridC=isDark?'#2d3748':'#e2e8f0',textC=isDark?'#a0aec0':'#718096';const ctx=canvas.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(hist.length<2){ctx.fillStyle=textC;ctx.font='11px sans-serif';ctx.fillText(T('noHistory'),16,H/2);return;}const pad={l:46,r:10,t:8,b:22};const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;ctx.strokeStyle=gridC;ctx.lineWidth=1;[0,.5,1].forEach(f=>{const y=pad.t+cH*(1-f);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();});function dl(data,color,minV,maxV,dashed=false){const range=maxV-minV||1;let started=false;ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;if(dashed)ctx.setLineDash([5,4]);else ctx.setLineDash([]);for(let i=0;i<data.length;i++){const v=data[i];if(v==null)continue;const x=pad.l+i/(data.length-1)*cW;const y=pad.t+cH*(1-(v-minV)/range);if(!started){ctx.moveTo(x,y);started=true;}else{ctx.lineTo(x,y);}}if(started)ctx.stroke();ctx.setLineDash([]);}const temps=hist.map(h=>h.temp).filter(v=>v!=null);const co2s=hist.map(h=>h.co2).filter(v=>v!=null);const tMin=temps.length?Math.min(...temps)-1:0,tMax=temps.length?Math.max(...temps)+1:1;if(temps.length>1)dl(hist.map(h=>h.temp),'#0066cc',tMin,tMax);if(owmData&&temps.length>1)dl(hist.map(()=>owmData.temp),'#38a169',tMin,tMax,true);if(co2s.length>1)dl(hist.map(h=>h.co2),'#dd6b20',Math.min(...co2s)-50,Math.max(...co2s)+50);ctx.fillStyle=textC;ctx.font='10px sans-serif';ctx.textAlign='right';if(temps.length)ctx.fillText(temps[temps.length-1].toFixed(1)+'°',pad.l-3,pad.t+12);if(co2s.length)ctx.fillText(co2s[co2s.length-1]+'ppm',pad.l-3,H-pad.b+2);ctx.textAlign='center';[0,.5,1].forEach(f=>{const idx=Math.floor(f*(hist.length-1));if(!hist[idx])return;const d=new Date(hist[idx].ts);ctx.fillStyle=textC;ctx.fillText(d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'),pad.l+f*cW,H-4);});ctx.textAlign='left';ctx.font='bold 10px sans-serif';ctx.fillStyle='#0066cc';ctx.fillText('— '+T('tempIn'),pad.l,pad.t+12);if(owmData){ctx.setLineDash([5,4]);ctx.beginPath();ctx.strokeStyle='#38a169';ctx.lineWidth=2;ctx.moveTo(pad.l+90,pad.t+8);ctx.lineTo(pad.l+105,pad.t+8);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#38a169';ctx.fillText(' '+T('outside'),pad.l+105,pad.t+12);}ctx.setLineDash([]);ctx.fillStyle='#dd6b20';ctx.fillText('— '+T('co2'),pad.l+(owmData?175:60),pad.t+12);}

function TN(k){return ((NCL[lang]||NCL.de)[k]!==undefined?(NCL[lang]||NCL.de)[k]:(NCL.de[k]!==undefined?NCL.de[k]:k));}
async function loadNeuracell(){try{const st=await apiFetch('/neuracell');neuracell=(st&&Object.keys(st).length)?st:neuracell;}catch(e){}renderNeuracell();}
async function ncRadon(active){try{await apiFetch('/neuracell/radon','POST',{active});toast('NeuraCell-X · '+(active?TN('radonActive'):TN('radonIdle')));}catch(e){toast('Fehler: '+e.message);}}
async function ncDewpoint(block){try{await apiFetch('/neuracell/dewpoint','POST',{block});toast('NeuraCell-X · '+(block?TN('dewBlocked'):TN('dewClear')));}catch(e){toast('Fehler: '+e.message);}}
function renderNeuracell(){
 const tg=document.getElementById('nc-tagline');if(!tg)return;
 tg.textContent=TN('tagline');
 document.getElementById('nc-note').innerHTML='<span>&#128161;</span><span>'+TN('note')+'</span>';
 const overall=document.getElementById('nc-overall');const body=document.getElementById('nc-body');
 const n=neuracell;
 if(!n||Object.keys(n).length===0){overall.className='nc-status-pill';overall.textContent='…';
  body.innerHTML='<div class="nc-card"><div class="nc-card-head"><div class="nc-card-icon">&#128225;</div><div><div class="nc-card-title">'+TN('waiting')+'</div></div></div><p class="nc-desc">'+TN('waitingDesc')+'</p></div>';return;}
 const radon=n.radon_protection===true;const dew=n.dewpoint_block===true;const ov=n.override_active===true;
 if(radon){overall.className='nc-status-pill prot';overall.textContent='☢️ '+TN('overall_radon');}
 else if(dew){overall.className='nc-status-pill warn';overall.textContent='💧 '+TN('overall_dew');}
 else{overall.className='nc-status-pill';overall.textContent='✅ '+TN('overall_ok');}
 // radon metrics
 const rv=(n.radon===null||n.radon===undefined)?null:n.radon;const th=n.radon_threshold||300;
 const pct=rv===null?0:Math.max(0,Math.min(100,Math.round(rv/(th*1.6)*100)));
 const rBadge=radon?'<span class="nc-badge danger">'+(ov?TN('override')+' · ':'')+TN('radonActive')+'</span>':'<span class="nc-badge">'+TN('radonIdle')+'</span>';
 const dBadge=dew?'<span class="nc-badge on">'+(ov?TN('override')+' · ':'')+TN('dewBlocked')+'</span>':'<span class="nc-badge">'+TN('dewClear')+'</span>';
 const fmt=(v,u)=>v===null||v===undefined?'&mdash;':(v+u);
 let html='<div class="nc-grid">';
 // Radon card
 html+='<div class="nc-card'+(radon?' on danger':'')+'">'
  +'<div class="nc-card-head"><div class="nc-card-icon">☢️</div><div><div class="nc-card-title">'+TN('radonTitle')+'</div><div class="nc-card-sub">'+TN('radonSub')+'</div></div>'+rBadge+'</div>'
  +'<div class="nc-readout"><div class="nc-metric"><div class="v">'+fmt(rv,'')+'<span style="font-size:.6rem;font-weight:700;color:var(--muted)"> Bq/m³</span></div><div class="l">'+TN('level')+'</div></div>'
  +'<div class="nc-metric"><div class="v">'+th+'</div><div class="l">'+TN('threshold')+'</div></div></div>'
  +'<div class="nc-bar"><i style="width:'+pct+'%"></i></div>'
  +'<div class="nc-desc">'+(radon?('<b style="color:var(--red)">'+TN('protecting')+'</b>'):TN('ready'))+' — '+TN('radonDesc')+'</div>'
  +'<div class="nc-btns"><button class="nc-btn danger" onclick="ncRadon(true)">☢️ '+TN('btnTest')+'</button><button class="nc-btn" onclick="ncRadon(false)">'+TN('btnReset')+'</button></div></div>';
 // Dew-point card
 html+='<div class="nc-card'+(dew?' on':'')+'">'
  +'<div class="nc-card-head"><div class="nc-card-icon">💧</div><div><div class="nc-card-title">'+TN('dewTitle')+'</div><div class="nc-card-sub">'+TN('dewSub')+'</div></div>'+dBadge+'</div>'
  +'<div class="nc-readout"><div class="nc-metric"><div class="v">'+fmt(n.indoor_dew_point,' °C')+'</div><div class="l">'+TN('indoor')+'</div></div>'
  +'<div class="nc-metric"><div class="v">'+fmt(n.outdoor_dew_point,' °C')+'</div><div class="l">'+TN('outdoor')+'</div></div></div>'
  +'<div class="nc-desc">'+(dew?('<b style="color:var(--orange)">'+TN('dewBlocked')+'</b> — '+TN('dewBlockDesc')):('<b style="color:var(--green)">'+TN('dewClear')+'</b> — '+TN('dewClearDesc')))+(radon?' <span style="color:var(--muted)">('+TN('overall_radon')+')</span>':'')+'</div>'
  +'<div class="nc-btns"><button class="nc-btn primary" onclick="ncDewpoint(true)">💧 '+TN('btnBlock')+'</button><button class="nc-btn" onclick="ncDewpoint(false)">'+TN('btnRelease')+'</button></div></div>';
 html+='</div>';
 body.innerHTML=html;
}

const API=(window.location.origin+'/api'),WS=((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');
const devices={},schedules={},history_data={};
let activeSmartDevice=null,ws=null,copySource=null;
lang=localStorage.getItem('lang')||'de';
document.getElementById('lang-select').value=lang;
applyLang();
loadDevices();connectWS();startWeatherTimer();loadNeuracell();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
