version: '3.8'

services:
  # -----------------------------------------------------------------------
  # MQTT Broker (Mosquitto) – the local message bus
  # -----------------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ambientika-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"   # WebSocket port (optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # -----------------------------------------------------------------------
  # Ambientika MQTT Bridge
  # Polls the Ambientika Cloud API and republishes data locally via MQTT.
  # Replace AMBIENTIKA_EMAIL / PASSWORD with your Ambientika account.
  # -----------------------------------------------------------------------
  bridge:
    image: ghcr.io/ambientika-eu/ambientika-mqtt-bridge:latest
    container_name: ambientika-bridge
    restart: unless-stopped
    depends_on:
      - mqtt
    environment:
      AMBIENTIKA_EMAIL:    ${AMBIENTIKA_EMAIL}
      AMBIENTIKA_PASSWORD: ${AMBIENTIKA_PASSWORD}
      MQTT_BROKER:         mqtt
      MQTT_PORT:           1883
      MQTT_PREFIX:         ambientika
      POLL_INTERVAL:       30
      HA_DISCOVERY:        false   # not needed for local app
      LOG_LEVEL:           INFO

  # -----------------------------------------------------------------------
  # Ambientika Local App Backend (FastAPI)
  # REST API + WebSocket – runs on port 8080
  # -----------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: ambientika-backend
    restart: unless-stopped
    depends_on:
      - mqtt
    ports:
      - "8080:8080"
    environment:
      MQTT_BROKER:   mqtt
      MQTT_PORT:     1883
      MQTT_PREFIX:   ambientika
      LOG_LEVEL:     INFO
      HISTORY_DB:    /data/history.db
      TZ:            ${TZ:-Europe/Berlin}          # für die Nachtzeit des Free-Cooling-Wächters
      # Free-Cooling-Wächter (Einstellungen auch in der App unter "Free Cooling";
      # dort gespeicherte Werte gewinnen gegenüber diesen Vorgaben)
      FREECOOLING_ENABLED:  ${FREECOOLING_ENABLED:-false}
      # OpenWeatherMap als Rückfallebene für den Außenwert (ein Sensor am Haus
      # auf ambientika/weather geht immer vor). Leer = aus.
      OWM_API_KEY:   ${OWM_API_KEY:-}
      OWM_LOCATION:  ${OWM_LOCATION:-}
    volumes:
      - ./frontend:/app/frontend:ro   # PWA aus demselben Container (frontend/, optional frontend/dist/)
      - ambientika-history:/data

volumes:
  mosquitto-data:
  mosquitto-log:
  ambientika-history:
