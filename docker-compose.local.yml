# 100% cloud-free Ambientika stack.
#
# Same as the upstream docker-compose.yml, EXCEPT the cloud-polling `bridge`
# service (ghcr.io/ambientika-eu/ambientika-mqtt-bridge, which needs your
# Ambientika account + internet) is replaced by `local-bridge`, which talks to
# the units directly over TCP:11000. No AMBIENTIKA_EMAIL / PASSWORD, no cloud.
#
# Drop these files into the ambientika-local-app repo root:
#   docker-compose.local.yml   (this file)
#   Dockerfile.bridge
#   ambientika_local_bridge.py
#   mosquitto/config/mosquitto.conf
#
# Run with:  docker compose -f docker-compose.local.yml up -d --build
# The PWA is then on http://<host>:8080 — fully offline once devices are
# redirected to this host (see README_LOCAL_CLOUDLESS.md).

services:
  # -----------------------------------------------------------------------
  # MQTT Broker (Mosquitto) – local message bus
  # -----------------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2
    container_name: ambientika-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"          # WebSocket (optional)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # -----------------------------------------------------------------------
  # LOCAL bridge – replaces the cloud poller.
  # Units open a TCP connection to :11000 and are controlled entirely on LAN.
  # -----------------------------------------------------------------------
  local-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: ambientika-local-bridge
    restart: unless-stopped
    depends_on:
      - mqtt
    ports:
      - "11000:11000"        # devices connect here (after redirection)
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_PREFIX: ambientika
      LOCAL_TCP_PORT: 11000
      HA_DISCOVERY: "false"  # the local-app does not need HA discovery
      # Setup frames are off unless a unit is listed in SETUP_DEVICES
      # (JSON per serial) — roles/zones from the official app stay untouched.
      SETUP_DEVICES: ${SETUP_DEVICES:-}
      SETUP_ALLOW_ROLE_CHANGE: ${SETUP_ALLOW_ROLE_CHANGE:-false}
      SEND_SETUP: ${SEND_SETUP:-false}   # legacy global setup, single unit only
      # Remembers which units to restore after a radon/dew-point protection,
      # also across a restart of the bridge (units offline at release included).
      STATE_FILE: ${STATE_FILE-/data/local_bridge_state.json}   # empty = memory only
      HOUSE_ID: ${HOUSE_ID:-1}         # target of the legacy global setup
      DEVICE_ROLE: ${DEVICE_ROLE:-0}
      DEVICE_ZONE: ${DEVICE_ZONE:-0}
      LOG_LEVEL: INFO
    volumes:
      - bridge-state:/data

  # -----------------------------------------------------------------------
  # Ambientika Local App Backend (FastAPI) + PWA – unchanged, MQTT-only.
  # -----------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: ambientika-backend
    restart: unless-stopped
    depends_on:
      - mqtt
    ports:
      - "8080:8080"
    environment:
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_PREFIX: ambientika
      LOG_LEVEL: INFO
      HISTORY_DB: /data/history.db
      TZ: ${TZ:-Europe/Berlin}
      FREECOOLING_ENABLED: ${FREECOOLING_ENABLED:-false}
      OWM_API_KEY: ${OWM_API_KEY:-}
      OWM_LOCATION: ${OWM_LOCATION:-}
    volumes:
      - ./frontend:/app/frontend:ro   # PWA aus demselben Container (frontend/, optional frontend/dist/)
      - ambientika-history:/data

volumes:
  bridge-state:
  mosquitto-data:
  mosquitto-log:
  ambientika-history:
